name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: EXPECTED_BUILD_SHA=$(git rev-parse --short HEAD) npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results
